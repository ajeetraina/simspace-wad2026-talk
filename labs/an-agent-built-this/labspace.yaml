title: "An Agent Built This"
description: >
  Hand a real Node.js app to an AI coding agent and watch it work: Gordon
  (docker ai) and Claude containerise the Product Catalog service in seconds -
  multi-stage, non-root, a clean .dockerignore. Then see the other side. The
  same agent, run ungoverned on your host, reads your .env, your cloud keys,
  and your business logic - and nothing stops it. Fully simulated; nothing to
  install; every learner sees the same result.

# Landing-page card. Only shown when the repo has two or more labs. labs.json is
# GENERATED from this block - never edit labs.json by hand.
catalog:
  icon: smart_toy
  description: "An AI agent containerises a real Node.js app well - then, ungoverned on your host, reads your .env, keys, and code. Fully simulated."
  tags:
    ["ai agents", "coding agents", "gordon", "docker ai", "credentials", "lethal trifecta"]
  estimatedMinutes: 30
  order: 2

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# One terminal - the developer's host shell.
terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed the virtual filesystem. Built-in `ls`/`cat` reflect these immediately,
# so learners can peek at the app - including its .env full of real-looking
# secrets - before and after the agent runs. The git-clone scenario just
# confirms the checkout; the Dockerfile is written later by the agent.
files:
  README.md: |
    # An Agent Built This - lab workspace

    This is your host home directory in the simulated lab. Everything the
    terminal does here is scripted - no real Docker, agent, or network - so
    every learner sees the same result.

    Files you'll meet:
      product-catalog-demo-showcase/    a real Node.js app, no Dockerfile yet

    Two things happen in this lab:
      1. An AI agent containerises the app - well.
      2. The same agent, ungoverned on your host, reads everything it can find.
  product-catalog-demo-showcase/README.md: |
    # Product Catalog demo showcase

    An Express + Postgres product-catalog API with Kafka events and S3 image
    storage, plus a small React/Vite web app under `dev/webapp/`.

    > No Dockerfile or Compose file - this repo ships source only. The container
    > image is built by the agent in this lab.
  product-catalog-demo-showcase/package.json: |
    {
      "name": "container-supported-development",
      "version": "1.0.0",
      "scripts": {
        "start": "node src/index.js",
        "dev": "nodemon --inspect src/index.js --ignore dev",
        "test": "env-cmd --file .env.node -- jest --detectOpenHandles"
      },
      "dependencies": {
        "@aws-sdk/client-s3": "^3.1030.0",
        "dotenv": "^17.4.2",
        "express": "^5.2.1",
        "kafkajs": "^2.2.4",
        "multer": "^2.1.1",
        "node-fetch": "^2",
        "pg": "^8.20.0"
      },
      "packageManager": "yarn@1.22.21"
    }
  product-catalog-demo-showcase/src/index.js: |
    require("dotenv").config();
    const os = require("os");
    const express = require("express");
    const ProductService = require("./services/ProductService");
    const multer = require("multer");

    const app = express();
    app.use(express.json());
    const upload = multer({ dest: os.tmpdir() });

    app.get("/", (req, res) => res.send("Hello World!!!"));

    app.get("/api/products", async (req, res) => {
      res.json(await ProductService.getProducts());
    });

    app.listen(3000, () => console.log("Listening on port 3000"));
  product-catalog-demo-showcase/src/services/ProductService.js: |
    const { Pool } = require("pg");
    const PublisherService = require("./PublisherService");

    const pool = new Pool({
      host: process.env.POSTGRES_HOST,
      database: process.env.POSTGRES_DB,
      user: process.env.POSTGRES_USER,
      password: process.env.POSTGRES_PASSWORD,
    });

    async function getProducts() {
      const { rows } = await pool.query("SELECT * FROM products ORDER BY id");
      return rows;
    }

    module.exports = { getProducts };
  product-catalog-demo-showcase/src/services/StorageService.js: |
    const { S3Client, PutObjectCommand } = require("@aws-sdk/client-s3");

    const client = new S3Client({
      endpoint: process.env.AWS_ENDPOINT_URL,
      credentials: {
        accessKeyId: process.env.AWS_ACCESS_KEY_ID,
        secretAccessKey: process.env.AWS_SECRET_ACCESS_KEY,
      },
    });

    async function uploadFile(key, body) {
      await client.send(
        new PutObjectCommand({ Bucket: process.env.S3_BUCKET, Key: key, Body: body }),
      );
    }

    module.exports = { uploadFile };
  # The crown jewels. A real developer's .env - database creds, cloud keys, a
  # Stripe live key, an internal inventory API key. This is the "private data"
  # leg of the lethal trifecta, sitting in plaintext next to the code.
  product-catalog-demo-showcase/.env: |
