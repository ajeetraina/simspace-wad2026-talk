version: "2.0"

metadata:
  id: find-vulnerabilities
  title: "Find the Vulnerabilities"
  summary: >
    Scan the agent-built image with Docker Scout (47 CVEs, most from the base),
    swap to a Docker Hardened Image, rebuild, and re-scan - the vulnerabilities
    collapse. Same app, a fraction of the attack surface. All simulated.

# `hardened` flips from false → true once the base is swapped to a DHI. Every
# Scout scenario has a "hardened" variant (matched first) so the same commands
# show the before and the after.
state:
  org: "your-org"
  catalog:
    hardened: false # image switched to a Docker Hardened Image base + rebuilt

settings:
  pace:
    build: 900 # simulated build step
    scan: 1200 # simulated Scout vulnerability analysis

defaults:
  unmatched:
    stderr: ["command not found - this command isn't part of the lab."]
    exit: 1

scenarios:
  # ===========================================================================
  # Environment niceties
  # ===========================================================================
  - id: docker-version
    when:
      command: [docker]
      args: { --version: { any: true } }
    then:
      output: ["Docker version 28.3.3, build 980b856"]

  - id: docker-scout-version
    when:
      command: [docker, scout, version]
    then:
      output:
        - "version: v1.15.0 (go1.23.1)"
        - "git commit: 6f2a9c3"

  - id: docker-login
    when:
      command: [docker, login]
    then:
      output:
        - "Authenticating with existing credentials..."
        - "Login Succeeded"

  # ===========================================================================
  # Section 1/2 - Docker Scout: quickview + full CVE list.
  # Hardened variants match first (first-match-wins).
  # ===========================================================================
  - id: docker-scout-quickview-hardened
    when:
      command: [docker, scout, quickview]
      state: { catalog.hardened: true }
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: build }
        - { text: "    ✓ Indexed 96 packages", delay: scan }
        - ""
        - "  Target             │  product-catalog:latest       │    0C     0H     1M     1L"
        - "    digest           │  b71c0e4a9f2b                 │"
        - "  Base image         │  dhi.io/node:20-hardened      │    0C     0H     1M     1L"
        - ""
        - "Nothing left to swap - you're already on the recommended hardened base."

  - id: docker-scout-quickview
    when:
      command: [docker, scout, quickview]
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: build }
        - { text: "    ✓ Indexed 431 packages", delay: scan }
        - ""
        - "  Target             │  product-catalog:latest   │    2C    12H    20M    13L"
        - "    digest           │  6f2a9c3b1d40             │"
        - "  Base image         │  node:20                  │    2C    11H    18M    11L"
        - "  Recommended base   │  dhi.io/node:20-hardened  │    0C     0H     1M     1L"
        - "                     │                           │   -2C   -11H   -17M   -10L"
        - ""
        - "Almost every finding traces to the fat node:20 base. Scout is already"
        - "pointing at the fix. Run `docker scout cves product-catalog:latest` for the detail."

  - id: docker-scout-cves-hardened
    when:
      command: [docker, scout, cves]
      state: { catalog.hardened: true }
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: build }
        - { text: "    ✓ Indexed 96 packages", delay: scan }
        - "    ✓ Detected 2 vulnerable packages with a total of 2 vulnerabilities"
        - ""
        - "  2 vulnerabilities found in 2 packages"
        - "    CRITICAL  0     HIGH  0     MEDIUM  1     LOW  1"
        - ""
        - "The critical and high findings are gone - the hardened base ships only what"
        - "the app needs and is patched upstream. Same app, a fraction of the attack surface."

  - id: docker-scout-cves
    when:
      command: [docker, scout, cves]
    then:
      output:
        - { text: "    ✓ Image stored for indexing", delay: build }
        - { text: "    ✓ Indexed 431 packages", delay: scan }
        - "    ✓ Detected 21 vulnerable packages with a total of 47 vulnerabilities"
        - ""
        - "## Packages and Vulnerabilities"
        - ""
        - "   1C     0H     0M     0L  wget 1.21"
        - "pkg:deb/debian/wget@1.21"
        - ""
        - "    ✗ CRITICAL CVE-2024-38428 [Improper Handling of Values]"
        - "      https://scout.docker.com/v/CVE-2024-38428"
        - "      Affected range : <1.21.4"
        - "      Fixed version  : 1.21.4"
        - ""
        - "   0C     1H     0M     0L  cross-spawn 7.0.3"
        - "pkg:npm/cross-spawn@7.0.3"
        - ""
        - "    ✗ HIGH CVE-2024-21538 [Inefficient Regular Expression Complexity]"
        - "      https://scout.docker.com/v/CVE-2024-21538"
        - "      Affected range : <7.0.5"
        - "      Fixed version  : 7.0.5"
        - ""
        - "  47 vulnerabilities found in 21 packages"
        - "    CRITICAL  2     HIGH  12     MEDIUM  20     LOW  13"
        - ""
        - "Most trace back to the fat node:20 base - packages like wget the app never"
        - "calls at runtime. A hardened base image cuts them sharply."

  - id: docker-scout-recommendations
    when:
      command: [docker, scout, recommendations]
    then:
      output:
        - { text: "    ✓ Analyzed base image node:20", delay: scan }
        - ""
        - "  Recommended base image update"
        - "  node:20  →  dhi.io/node:20-hardened"
        - "    removes  2 CRITICAL · 11 HIGH · 17 MEDIUM · 10 LOW"
        - "    minimal, distroless, non-root · signed · SBOM + SLSA provenance included"
        - ""
        - "Apply it by swapping the FROM line, or ask the agent to do it (next section)."

  # `docker scout compare` - only meaningful once a hardened image also exists.
  - id: docker-scout-compare-hardened
    when:
      command: [docker, scout, compare]
      state: { catalog.hardened: true }
    then:
      output:
        - { text: "    ✓ Comparing product-catalog:latest  vs  product-catalog:node20", delay: scan }
        - ""
        - "  CATEGORY       node:20 base      dhi hardened      CHANGE"
        - "  Critical       2                 0                 -2"
        - "  High           12                0                 -12"
        - "  Medium         20                1                 -19"
        - "  Low            13                1                 -12"
        - "  Packages       431               96                -335"
        - ""
        - "Same application. 45 fewer vulnerabilities, 335 fewer packages to attack."

  - id: docker-scout-compare
    when:
      command: [docker, scout, compare]
    then:
      output:
        - "Nothing to compare yet - only the node:20 image exists."
        - "Switch the base to a Docker Hardened Image and rebuild first, then re-run compare."

  # ===========================================================================
  # Section 3 - Swap the base to a Docker Hardened Image and rebuild.
  # `docker ai "..."` (exact prompt) matches; agent-session + `docker build`
  # fallbacks share the same effect via the YAML anchor.
  # ===========================================================================
  - id: docker-ai-harden
    when:
      command: [docker, ai]
      prompt: "Switch the Dockerfile to a Docker Hardened Image base and rebuild"
    then: &harden
      state: { catalog.hardened: true }
      files:
        - create: product-catalog-demo-showcase/Dockerfile
          content: |
            # Rewritten to a hardened, minimal base (Docker Hardened Image).
            # syntax=docker/dockerfile:1

            FROM dhi.io/node:20-dev AS build
            WORKDIR /usr/src/app
            COPY package*.json ./
            RUN npm ci --omit=dev
            COPY src ./src

            FROM dhi.io/node:20-hardened AS final
            ENV NODE_ENV=production
            WORKDIR /usr/src/app
            # DHI runtime is already distroless and non-root
            COPY --from=build /usr/src/app/node_modules ./node_modules
            COPY --from=build /usr/src/app/src ./src
            COPY package.json ./
            EXPOSE 3000
            CMD ["node", "src/index.js"]
      output:
        - "● Swapping FROM node:20  →  FROM dhi.io/node:20-hardened (minimal, signed)."
        - "● Building on the -dev variant, copying only node_modules into the distroless runtime."
        - { text: "  [+] Building 5.4s  RUN npm ci --omit=dev", delay: build }
        - { text: "  => naming to docker.io/library/product-catalog:latest", delay: build }
        - "● Done. Re-run `docker scout cves product-catalog:latest` - the CVE count collapses."

  - id: agent-harden
    when:
      agent: true
      promptContains: [hardened]
    then: *harden

  # Manual path: build after the learner edits the Dockerfile themselves. Once
  # the FROM line already reads a DHI base (state.hardened), rebuild succeeds
  # with the hardened result; otherwise it just rebuilds the node:20 image.
  - id: docker-build-hardened
    when:
      command: [docker, build]
      state: { catalog.hardened: true }
    then:
      output:
        - { text: "  [+] Building 5.4s", delay: build }
        - "  => naming to docker.io/library/product-catalog:latest (hardened base)"

  - id: docker-build
    when:
      command: [docker, build]
    then:
      output:
        - { text: "  [+] Building 7.4s", delay: build }
        - "  => naming to docker.io/library/product-catalog:latest (node:20 base)"

  # ===========================================================================
  # Section 4 - The Scout policy gate. PASSES only once the base is hardened.
  # ===========================================================================
  - id: docker-scout-policy-hardened
    when:
      command: [docker, scout, policy]
      state: { catalog.hardened: true }
    then:
      output:
        - { text: "    ✓ Evaluating policies for product-catalog:latest", delay: scan }
        - "  no-critical-cves     PASSED   0 critical, 0 high"
        - "  require-sbom         PASSED   sbom attestation present"
        - "  require-provenance   PASSED   slsa-provenance present"
        - ""
        - "Policy status: PASSED (3 of 3 policies met) - image may be promoted."

  - id: docker-scout-policy
    when:
      command: [docker, scout, policy]
    then:
      output:
        - { text: "    ✓ Evaluating policies for product-catalog:latest", delay: scan }
        - "  no-critical-cves     FAILED   2 critical, 12 high"
        - "  require-sbom         FAILED   no SBOM attestation present"
        - "  require-provenance   FAILED   no SLSA provenance attestation"
        - ""
        - "Policy status: FAILED (0 of 3 policies met) - image NOT promoted. Harden the base first."

  # An agent session (docker ai / claude) so free-form prompts stay graceful.
  - id: docker-ai-session
    when:
      command: [docker, ai]
    then:
      session:
        prompt: "gordon> "
        intro:
          - "Gordon (Docker AI) ready. Enter a task, or type /exit to leave."
        outro:
          - "Gordon session ended."

  - id: claude-session
    when:
      command: [claude]
    then:
      session:
        prompt: "claude> "
        intro:
          - "Claude Code ready. Enter a task, or type /exit to leave."
        outro:
          - "Claude session ended."

  - id: agent-fallback
    when:
      agent: true
    then:
      output:
        - "● I can act on the scripted tasks in this lab. Try asking me to switch the"
        - "  Dockerfile to a Docker Hardened Image base and rebuild."

  # ===========================================================================
  # Filler no-ops so ordinary navigation doesn't error out.
  # ===========================================================================
  - id: cd
    when:
      command: [cd]
    then:
      output:
        - "Note: this simulated terminal has no working directory - every command runs from the lab root."
        - "Reference files by full path, e.g. `cat product-catalog-demo-showcase/Dockerfile`."

  - id: tree-hardened
    when:
      command: [tree]
      state: { catalog.hardened: true }
    then:
      output:
        - "product-catalog-demo-showcase"
        - "├── Dockerfile        ← now FROM dhi.io/node:20-hardened"
        - "├── package.json"
        - "└── README.md"
        - ""
        - "1 directory, 3 files"

  - id: tree
    when:
      command: [tree]
    then:
      output:
        - "product-catalog-demo-showcase"
        - "├── Dockerfile        ← FROM node:20"
        - "├── package.json"
        - "└── README.md"
        - ""
        - "1 directory, 3 files"
