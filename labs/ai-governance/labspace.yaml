title: "Securing the Agentic Stack with Docker AI Governance"
description: >
  An AI agent (Gordon) containerises a real Node.js app - then you secure the
  whole agentic stack. Harden what it builds (Docker Scout → Docker Hardened
  Images → a signed, policy-gated CI pipeline) and contain what it can touch
  (sandbox network, filesystem, credential, and MCP governance). Fully simulated;
  nothing to install; every learner sees the same allow/deny decisions.

# Optional catalog card. Only shown on the landing page when this repo has two or
# more labs. labs.json is GENERATED from this block - never edit labs.json by hand.
catalog:
  icon: shield_lock
  description: "Harden what an AI agent builds and contain what it can touch: network, filesystem, credentials, and MCP. Fully simulated."
  tags:
    ["ai governance", "supply chain", "dhi", "docker scout", "sandbox", "mcp"]
  estimatedMinutes: 75
  # Deck is order 1; the three labs follow it in teaching sequence.
  order: 4

# Command behaviour lives in simulator.yaml (relative to this file).
simulator: simulator.yaml

# One terminal - the developer's host shell, with `sbx` ready to use.
terminals:
  - id: host
    title: Terminal
    icon: terminal

# Seed the virtual filesystem. Built-in `ls`/`cat` reflect these immediately;
# scenarios and save-as blocks add more on top.
files:
  README.md: |
    # Docker AI Governance - lab workspace

    This is your host home directory in the simulated lab. Everything the
    terminal does here is scripted - no real Docker, sbx daemon, or network -
    so every learner sees the same allow/deny decisions.

    Files you'll meet:
      workdemo/                                 the one directory sandboxes are allowed to mount
      setup-policies.sh                         wraps the Governance API to provision network + filesystem policies
      product-catalog-demo-showcase/            a real Node.js app the agent containerises (Product Catalog section)
  setup-policies.sh: |
    #!/usr/bin/env bash
    #
    # setup-policies.sh - provision Docker AI Governance policies via the API.
    #
    # A thin wrapper over the same Governance API calls shown in the
    # Observability section: authenticate once, then create each policy and
    # POST its allow/deny rules. Both "front doors" (Admin Console and this
    # script) write to the SAME source of truth for the org.
    #
    #   bash setup-policies.sh            # provision network + filesystem policies
    #   bash setup-policies.sh network    # provision just the network policy
    #
    # Config via env (override as needed):
    #   ORG          Docker org slug            (default: your-org)
    #   DOCKER_USER  Docker username
    #   DOCKER_PAT   Personal Access Token (used as the password to log in)
    set -euo pipefail

    ORG="${ORG:-your-org}"
    API="https://hub.docker.com/v2"
    SCOPE="${1:-all}"   # "network" | "all"

    # --- 1. Authenticate -> bearer token -------------------------------------
    echo "Authenticating to the Docker AI Governance API..."
    TOKEN=$(curl -sS -X POST "$API/users/login" \
      -H "Content-Type: application/json" \
      -d "{\"username\":\"${DOCKER_USER:?set DOCKER_USER}\",\"password\":\"${DOCKER_PAT:?set DOCKER_PAT}\"}" \
      | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
    auth=(-H "Authorization: Bearer $TOKEN")

    # --- helpers -------------------------------------------------------------
    # create_policy <name> -> echoes the new policy id
    create_policy() {
      curl -sS -X POST "$API/orgs/$ORG/governance/policies" "${auth[@]}" \
        -H "Content-Type: application/json" \
        -d "{\"name\":\"$1\",\"type\":\"allowlist_v0\"}" \
        | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])'
    }

    # add_rule <policy_id> <json-rule-body>
    add_rule() {
      curl -sS -X POST "$API/orgs/$ORG/governance/policies/$1/rules" "${auth[@]}" \
        -H "Content-Type: application/json" -d "$2" >/dev/null
    }

    # --- 2. Network policy ---------------------------------------------------
    echo "Creating policy 'Labspace AI Governance - network'"
    NET_ID=$(create_policy "Labspace AI Governance - network")
    add_rule "$NET_ID" '{"name":"allow AI services","action":"allow","hosts":["api.anthropic.com:443","api.openai.com:443","*.googleapis.com:443"]}'
    add_rule "$NET_ID" '{"name":"allow Docker services","action":"allow","hosts":["*.docker.com:443","*.docker.io:443","dhi.io:443"]}'
    add_rule "$NET_ID" '{"name":"deny exfiltration","action":"deny","hosts":["paste.ee","pastebin.com","hooks.slack.com"]}'
    echo "  + allow AI services   (allow)"
    echo "  + allow Docker services (allow)"
    echo "  + deny exfiltration   (deny)"

    # --- 3. Filesystem policy (skipped when arg is "network") ----------------
    if [ "$SCOPE" != "network" ]; then
      echo "Creating policy 'Labspace AI Governance - filesystem'"
      FS_ID=$(create_policy "Labspace AI Governance - filesystem")
      add_rule "$FS_ID" '{"name":"allow workdemo","action":"allow","access":"read+write","paths":["~/workdemo"]}'
      add_rule "$FS_ID" '{"name":"deny credentials","action":"deny","access":"read+write","paths":["~/.aws","~/.ssh","~/.docker/config.json"]}'
      echo "  + allow workdemo      (allow, read+write)"
      echo "  + deny credentials    (deny, read+write)"
    fi

    echo
    echo "Done. Policies applied to $ORG. Run \`sbx policy reset\` to sync locally."
  product-catalog-demo-showcase/package.json: |
    {
      "name": "container-supported-development",
      "version": "1.0.0",
      "scripts": {
        "start": "node src/index.js",
        "dev": "nodemon --inspect src/index.js --ignore dev",
        "test": "env-cmd --file .env.node -- jest --detectOpenHandles"
      },
      "dependencies": {
        "@aws-sdk/client-s3": "^3.1030.0",
        "dotenv": "^17.4.2",
        "express": "^5.2.1",
        "kafkajs": "^2.2.4",
        "multer": "^2.1.1",
        "node-fetch": "^2",
        "pg": "^8.20.0"
      },
      "packageManager": "yarn@1.22.21"
    }
  product-catalog-demo-showcase/src/index.js: |
    require("dotenv").config();
    const os = require("os");
    const express = require("express");
    const ProductService = require("./services/ProductService");
    const multer = require("multer");

    const app = express();
    app.use(express.json());
    const upload = multer({ dest: os.tmpdir() });

    app.get("/", (req, res) => res.send("Hello World!!!"));

    app.get("/api/products", async (req, res) => {
      res.json(await ProductService.getProducts());
    });

    app.listen(3000, () => console.log("Listening on port 3000"));

# Ordered instruction pages (markdown), rendered in the left-hand panel.
# Arc: set up Docker Sandboxes, then contain what the agent can TOUCH (policy →
# credential → network → filesystem), then the tools it CALLS (MCP
# governance), tied together by the capstone and audit. The build half - the Product
# Catalog, its fat node:20 base, and the one-line Docker Hardened Images fix - is
# covered in the "An Agent Built This" and "Find the Vulnerabilities" labs and is
# not repeated here.
sections:
  - title: "Lab 1: Setting up Docker Sandboxes (sbx)"
    contentPath: sbx-setup.md
  - title: "Lab 2: The Policy Model"
    contentPath: 05-policy-model.md
  - title: "Lab 3: Credential Isolation"
    contentPath: 08-credential-isolation.md
  - title: "Lab 4: Network Enforcement"
    contentPath: 06-network-demo.md
  - title: "Lab 5: Filesystem Isolation"
    contentPath: 07-filesystem-isolation.md
  - title: MCP Governance
    contentPath: 09-mcp.md
  - title: Putting It All Together
    contentPath: 10-capstone.md
  - title: Observability & Audit
    contentPath: 11-observability.md
  - title: From Audit Log to Alarm (Datadog)
    contentPath: 12-datadog-alarm.md

# $$name$$ in markdown is replaced with these values. `org` is overridden by the
# :variableDefinition prompt in "Lab 1: Setting up Docker Sandboxes (sbx)".
variables:
  org: your-org
